name: Bug report
description: Report reproducible incorrect behavior in Kosh.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, account numbers, transaction data, database dumps, or `.env` values.
  - type: input
    id: version
    attributes:
      label: Kosh version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment environment
      description: OS, Node.js version, PostgreSQL version, and Docker/reverse proxy details if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
